# =============================================================================
# Project Scolecite - Nginx Reverse Proxy Configuration
# =============================================================================
# Place this file at: /etc/nginx/sites-available/scolecite
# Symlink:  ln -s /etc/nginx/sites-available/scolecite /etc/nginx/sites-enabled/
# Test:     nginx -t
# Reload:   systemctl reload nginx
#
# Let's Encrypt SSL setup:
#   1. Install certbot:  sudo apt install certbot python3-certbot-nginx
#   2. Start with HTTP-only first (or use IP-only block below)
#   3. Run: sudo certbot certonly --webroot -w /var/www/certbot -d YOUR_DOMAIN --email YOUR_EMAIL
#   4. Replace YOUR_DOMAIN in ssl_certificate paths below
#   5. sudo nginx -t && sudo systemctl reload nginx
#   6. Auto-renewal: certbot.timer (systemd) handles it
# =============================================================================

# Rate limiting zone (10 req/s per IP for API, 2 req/s for auth-like endpoints)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

# Upstream: docker-compose exposes server on 127.0.0.1:8000
upstream scolecite_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_OR_IP;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS server ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN_OR_IP;

    # --- SSL certificates (Let's Encrypt / Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/YOUR_DOMAIN/chain.pem;

    # --- SSL hardening ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- Logging ---
    access_log /var/log/nginx/scolecite_access.log;
    error_log  /var/log/nginx/scolecite_error.log warn;

    # --- Client body size (for chat messages, settings updates) ---
    client_max_body_size 10M;

    # --- Health check (no rate limit) ---
    location /health {
        proxy_pass http://scolecite_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    location /ready {
        proxy_pass http://scolecite_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # --- SSE streaming endpoint (long-lived connections) ---
    location /api/stream {
        proxy_pass http://scolecite_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # SSE-specific: disable buffering, long timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;   # 24 hours for SSE
        proxy_send_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # --- Bot control endpoints (stricter rate limit) ---
    location ~ ^/api/bot/(start|stop|emergency) {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://scolecite_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API endpoints (general rate limit) ---
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://scolecite_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        # Timeout for AI responses (can be slow)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- MCP endpoints ---
    location /mcp/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://scolecite_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # --- Block everything else ---
    location / {
        return 404;
    }
}

