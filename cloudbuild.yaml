# =============================================================================
# Project Scolecite — Cloud Build CI/CD Pipeline
# Trigger: push to main branch or manual gcloud builds submit
# =============================================================================
# Required substitutions (set in Cloud Build trigger or --substitutions):
#   _REGION            : Cloud Run region (default: asia-northeast3)
#   _SERVICE_NAME      : Cloud Run service name (default: scolecite-bot)
#   _CLOUD_SQL_CONN    : Cloud SQL connection name (project:region:instance)
#   _VPC_CONNECTOR     : VPC connector name (default: scolecite-vpc)
#   _MIN_INSTANCES     : min instances (default: 0)
#   _MAX_INSTANCES     : max instances (default: 3)
# =============================================================================

substitutions:
  _REGION: asia-northeast3
  _SERVICE_NAME: scolecite-bot
  _CLOUD_SQL_CONN: ""
  _VPC_CONNECTOR: scolecite-vpc
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "3"

steps:
  # ---- Step 1: Build Docker image ----
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/scolecite/${_SERVICE_NAME}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/scolecite/${_SERVICE_NAME}:latest
      - --cache-from
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/scolecite/${_SERVICE_NAME}:latest
      - .
    id: build

  # ---- Step 2: Push to Artifact Registry ----
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/scolecite/${_SERVICE_NAME}
    id: push
    waitFor: [build]

  # ---- Step 3: Deploy to Cloud Run ----
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/scolecite/${_SERVICE_NAME}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8000
      - --concurrency=80
      - --cpu=2
      - --memory=2Gi
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --timeout=300
      - --set-env-vars=TRADING_MODE=paper,ENABLE_PROMPT_CACHING=true
      - --set-secrets=ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,XAI_GROK_API_KEY=XAI_GROK_API_KEY:latest,POLYGON_API_KEY=POLYGON_API_KEY:latest,APCA_API_KEY_ID=APCA_API_KEY_ID:latest,APCA_API_SECRET_KEY=APCA_API_SECRET_KEY:latest,DATABASE_URL=DATABASE_URL:latest
      - --add-cloudsql-instances=${_CLOUD_SQL_CONN}
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=all-traffic
      - --startup-cpu-boost
      - --execution-environment=gen2
    id: deploy
    waitFor: [push]

# Use Artifact Registry (not deprecated GCR)
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/scolecite/${_SERVICE_NAME}

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
