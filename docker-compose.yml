# =============================================================================
# Project Scolecite - Docker Compose (local development)
# =============================================================================

version: "3.9"

services:
  server:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./scolecite.db:/app/scolecite.db
    restart: unless-stopped
